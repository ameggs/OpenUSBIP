name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        # PySide6 needs these X libraries even to import under xvfb.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Byte-compile everything
        run: python -m compileall -q src openusbip_client.py openusbip_server.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for f in install-*.sh; do
            echo "== $f"
            bash -n "$f"
          done
      - uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
        continue-on-error: true

  windows:
    # Windows is client-only. Its support is the part hardest to verify by
    # hand -- tool discovery, the packaged client build, and PowerShell syntax
    # all only fail on Windows. A runner exercises them on every push instead.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$null, [ref]$errors) > $null
            if ($errors) {
              $failed = $true
              Write-Host "FAIL $($file.Name)"
              $errors | ForEach-Object {
                Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)"
              }
            } else {
              Write-Host "ok   $($file.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests on Windows
        # The Windows code paths -- find_command's Program Files search and
        # run_command's elevation refusal -- only actually execute here.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Build the executable
        # Windows is client-only: there is no Windows server executable.
        shell: pwsh
        run: |
          pip install "pyinstaller>=6.3"
          pyinstaller --noconfirm packaging/windows/openusbip-client.spec

      - name: Check the executable starts
        shell: pwsh
        # The client is a windowed GUI app with no --help, so launch it and
        # check it is still running after a few seconds. A missing hidden
        # import kills it at startup and shows up here and nowhere earlier.
        run: |
          $proc = Start-Process -FilePath .\dist\OpenUSBIP\OpenUSBIP.exe -PassThru
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            throw "client exe exited at startup (code $($proc.ExitCode))"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host "client exe starts"

      - uses: actions/upload-artifact@v4
        with:
          name: openusbip-windows
          path: dist/
          retention-days: 14
